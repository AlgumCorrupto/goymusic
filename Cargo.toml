[package]
name = "goymusic"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/*"]
resolver = "3"

[dependencies]
context = {path = "crates/context"}
frontend = {path = "crates/frontend"}
improviser = {path = "crates/improviser"}
mididevice = {path = "crates/mididevice"}

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
