[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
context = { path = "../context" }
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "wayland",
    "x11",
    "default_fonts",
] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "wayland", "x11"] }
hotkeys = { path = "../hotkeys" }

config = { path = "../config" }