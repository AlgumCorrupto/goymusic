[package]
name = "hotkeys"
version = "0.1.0"
edition = "2024"

[features]
default = ["native", "portal"]
native = ["dep:global-hotkey"]
portal = ["dep:ashpd", "dep:tokio", "dep:futures-util"]

[dependencies]
global-hotkey = { version = "0.6", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", optional = true, default-features = false, features = ["tokio", "global_shortcuts"] }
tokio = { version = "1", features = ["rt"], optional = true }
futures-util = { version = "0.3", optional = true }